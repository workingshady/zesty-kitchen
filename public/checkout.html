<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Zesty Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/captcha.css">
  <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>
  <header class="header">
    <div class="wrap header__row">
      <a class="logo" href="/"><span id="chef-slot"></span><span class="logo__name">Zesty Kitchen <small>checkout of doom</small></span></a>
      <div class="header__meta"><span class="pill">🔒 100% secure-ish</span><span class="pill hide-sm">🧾 No real money. Ever.</span><a class="pill arcade-link" href="/arcade" aria-label="Arcade: games with coworker characters" title="Arcade / ألعاب: play games with coworker characters"><span aria-hidden="true">🕹️</span><span class="arcade-link__txt">Arcade / ألعاب</span></a></div>
    </div>
  </header>

  <main class="wrap co-main">
    <h1 class="co-title"><span class="wordart">Checkout</span> / الدفع</h1>
    <nav class="co-progress" aria-label="Checkout progress">
      <ol class="steps co-steps" id="steps"></ol>
      <p class="co-step-now" id="step-now"></p>
    </nav>
    <p class="cap-sr" id="live" aria-live="polite"></p>
    <div class="checkout">
      <div id="step"></div>
      <aside class="panel summary co-summary" aria-label="Order summary">
        <details id="sum-details">
          <summary><span id="sum-head">🧾 طلبك / Your order</span><span class="co-summary__chev" aria-hidden="true">▾</span></summary>
          <div id="summary"></div>
        </details>
      </aside>
    </div>
  </main>

  <script src="/js/checkout.js" type="module"></script>
</body>
</html>
