<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Zesty Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/captcha.css">
</head>
<body>
  <header class="header">
    <div class="wrap header__row">
      <a class="logo" href="/"><span id="chef-slot"></span><span class="logo__name">Zesty Kitchen <small>checkout of doom</small></span></a>
      <div class="header__meta"><span class="pill">🔒 100% secure-ish</span><span class="pill hide-sm">🧾 No real money. Ever.</span></div>
    </div>
  </header>

  <main class="wrap">
    <h1 style="margin-top:20px"><span class="wordart">Checkout</span> / الدفع</h1>
    <ol class="steps" id="steps" aria-label="Checkout progress"></ol>
    <div class="checkout">
      <div id="step"></div>
      <aside class="panel summary" aria-label="Order summary">
        <h2 style="font-size:1.4rem">🧾 طلبك / Your order</h2>
        <div id="summary"></div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/js-confetti@0.12.0/dist/js-confetti.browser.js" defer></script>
  <script src="/js/checkout.js" type="module"></script>
</body>
</html>
