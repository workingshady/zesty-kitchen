<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Order · Zesty Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap header__row">
      <a class="logo" href="/"><span id="chef-slot"></span><span class="logo__name">Zesty Kitchen <small>live tracking (lies)</small></span></a>
    </div>
  </header>

  <main class="wrap" style="max-width:820px">
    <section class="panel" style="margin-top:20px">
      <h1 id="title">Order placed 🎉</h1>
      <p id="eta">ETA: 25–35 years</p>
      <div class="tracker" id="tracker" aria-live="polite"></div>
      <p id="status-text" aria-live="polite"></p>
      <svg class="office-map" viewBox="0 0 400 240" role="img" aria-label="Map of the office with your courier wandering around">
        <rect x="0" y="0" width="400" height="240" fill="#fff"/>
        <g stroke="#111" stroke-width="3" fill="#fff4e0">
          <rect x="10" y="10" width="120" height="90" rx="6"/>
          <rect x="140" y="10" width="120" height="90" rx="6"/>
          <rect x="270" y="10" width="120" height="90" rx="6" fill="#ffc700"/>
          <rect x="10" y="140" width="180" height="90" rx="6"/>
          <rect x="210" y="140" width="180" height="90" rx="6" fill="#ff69b4"/>
        </g>
        <g font-family="Baloo Bhaijaan 2, sans-serif" font-size="13" fill="#111" text-anchor="middle">
          <text x="70" y="60">🍳 Kitchen</text>
          <text x="200" y="60">☕ Coffee corner</text>
          <text x="330" y="60">📊 Meeting room</text>
          <text x="100" y="190">🧑‍💼 HR</text>
          <text x="300" y="190">🪑 Desk #4 (you)</text>
        </g>
        <text id="courier" x="70" y="120" font-size="28" text-anchor="middle">🛵</text>
      </svg>
      <div class="panel__actions"><a class="btn white" href="/">← Order more coworkers</a><a class="btn red" href="/#leaderboard">🏆 Leaderboard</a></div>
    </section>
  </main>

  <script src="/js/order.js" type="module"></script>
</body>
</html>
