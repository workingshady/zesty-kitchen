<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🕹️ Arcade · Zesty Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/game404.css">
</head>
<body>
  <main class="wrap ar-wrap" id="arcade">
    <header class="ar-head">
      <h1><span class="wordart">Arcade</span> 🕹️</h1>
      <p class="ar-sub">Four tiny games. Your coworkers are the snacks.
        <span lang="ar" dir="rtl">أربع ألعاب صغيرة، وزمايلك هم الأكل.</span></p>
    </header>

    <nav class="ar-picker" id="picker" aria-label="Pick a game"></nav>

    <div class="ar-grid">
      <section class="ar-stage" aria-label="Game screen">
        <div class="ar-frame" id="frame" data-state="ready">
          <canvas id="game" class="ar-canvas" width="360" height="480" tabindex="0" role="img" aria-label="Mini game"></canvas>
          <button type="button" class="ar-pause" id="pauseBtn" aria-label="Pause (P or Esc)" title="Pause (P)"><span></span><span></span></button>
          <div class="ar-overlay" id="overlay"></div>
          <div class="ar-toasts" id="toasts" aria-live="polite"></div>
        </div>
        <p class="ar-keys" id="keys"></p>
        <p class="ar-sr" id="live" aria-live="polite"></p>
      </section>

      <aside class="ar-side">
        <section class="ar-panel">
          <h2>Play as <span>· <bdi lang="ar" dir="rtl">العب بـ</bdi></span></h2>
          <div class="ar-chars" id="chars" role="group" aria-label="Choose your character"></div>
          <p class="ar-playing" id="playing"></p>
        </section>
        <section class="ar-panel">
          <h2>Leaderboard <span id="lbGame"></span></h2>
          <p class="ar-lbsrc" id="lbSrc"></p>
          <ol class="ar-lb" id="lb"></ol>
        </section>
        <section class="ar-panel">
          <h2>You <span>· <bdi lang="ar" dir="rtl">انت</bdi></span></h2>
          <div class="ar-mebox" id="me"></div>
        </section>
        <section class="ar-panel">
          <h2>Achievements <span id="achCount"></span></h2>
          <ul class="ar-ach" id="ach"></ul>
        </section>
      </aside>
    </div>

    <p class="ar-back"><a class="btn red" href="/">← Back to the menu</a></p>
  </main>
  <script src="/js/game404.js" type="module"></script>
</body>
</html>
