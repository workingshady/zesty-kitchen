<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kitchen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>👨‍🍳 Kitchen Admin</h1>
    <button id="logout" class="btn ghost" hidden>Log out</button>
  </header>

  <main>
    <section id="login" class="card narrow" hidden>
      <h2>Chef only 🔒</h2>
      <form id="login-form">
        <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Log in</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="overview">📊 Overview</button>
        <button class="tab" data-tab="dishes">🍽️ Dishes</button>
        <button class="tab" data-tab="reviews">💬 Reviews</button>
        <button class="tab" data-tab="orders">🧾 Orders</button>
      </nav>

      <div id="tab-overview" class="tab-panel">
        <div class="row-between">
          <h2>Overview</h2>
          <button class="btn ghost small" id="refresh-overview">↻ Refresh</button>
        </div>
        <div id="overview"></div>
      </div>

      <div id="tab-dishes" class="tab-panel" hidden>
        <div class="row-between">
          <h2>Dishes</h2>
          <button class="btn" id="new-dish" title="Shortcut: n">+ New dish</button>
        </div>
        <div class="toolbar">
          <input type="search" id="dish-search" placeholder="Search name, job title… ( / )" aria-label="Search dishes" dir="auto">
          <select id="dish-cat" aria-label="Category"><option value="">All categories</option></select>
          <select id="dish-vis" aria-label="Visibility">
            <option value="">Visible + hidden</option>
            <option value="visible">👁 Visible only</option>
            <option value="hidden">🙈 Hidden only</option>
          </select>
        </div>
        <div class="bulkbar">
          <label class="inline"><input type="checkbox" id="dish-all"> <span id="dish-count">0 selected</span></label>
          <button class="btn small ghost" data-bulk-dish="show" disabled>👁 Show</button>
          <button class="btn small ghost" data-bulk-dish="hide" disabled>🙈 Hide</button>
          <button class="btn small danger" data-bulk-dish="delete" disabled>Delete</button>
        </div>
        <p class="hint" id="dish-hint">Drag rows to reorder.</p>
        <ul id="dish-list" class="dish-list"></ul>
      </div>

      <div id="tab-reviews" class="tab-panel" hidden>
        <h2>Reviews</h2>
        <div class="toolbar">
          <input type="search" id="review-search" placeholder="Search text or name… ( / )" aria-label="Search reviews" dir="auto">
          <select id="review-dish" aria-label="Dish"><option value="">All dishes</option></select>
          <select id="review-sort" aria-label="Sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="lowest">Lowest 🌶️ first</option>
            <option value="highest">Highest 🌶️ first</option>
          </select>
        </div>
        <div class="bulkbar">
          <label class="inline"><input type="checkbox" id="review-all"> <span id="review-count">0 selected</span></label>
          <button class="btn small danger" id="review-bulk-delete" disabled>Delete selected</button>
        </div>
        <ul id="review-list" class="simple-list"></ul>
      </div>

      <div id="tab-orders" class="tab-panel" hidden>
        <div class="row-between">
          <h2>Orders</h2>
          <div class="btn-group">
            <button class="btn ghost small" id="export-csv">⬇ Export CSV</button>
            <button class="btn danger small" id="reset-board">Reset leaderboard</button>
          </div>
        </div>
        <div class="toolbar">
          <input type="search" id="order-search" placeholder="Search customer, dish, #number… ( / )" aria-label="Search orders" dir="auto">
          <div class="seg" role="group" aria-label="Date range">
            <button class="seg-btn" data-range="today">Today</button>
            <button class="seg-btn" data-range="7d">7 days</button>
            <button class="seg-btn active" data-range="all">All</button>
          </div>
        </div>
        <p class="hint" id="order-summary"></p>
        <ul id="order-list" class="simple-list"></ul>
      </div>
    </section>
  </main>

  <dialog id="dish-dialog">
    <form id="dish-form" method="dialog">
      <h2 id="dish-dialog-title">Dish</h2>
      <div class="photo-row">
        <div class="preview" id="photo-preview">🍽️</div>
        <label class="grow">📸 Photo (any shape, it gets cropped square) <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif"></label>
      </div>
      <div class="grid2">
        <label>Arabic name / الاسم * <input name="name_ar" required maxlength="60" dir="rtl" placeholder="مندي أحمد"></label>
        <label>English name (optional) <input name="name_en" maxlength="60" placeholder="Ahmed Mandi"></label>
      </div>
      <div class="grid2">
        <label>💼 Job title (optional) <input name="job_title" maxlength="80" dir="auto" placeholder="Senior Excel Abuser"></label>
        <label>Category <select name="category" id="category-select"></select></label>
      </div>
      <label>Description <textarea name="description" maxlength="500" rows="2" dir="auto" placeholder="Slow-cooked since the 9am standup…"></textarea></label>
      <label>💬 Catchphrase (optional) <input name="catchphrase" maxlength="140" dir="auto" placeholder="أنا مش فاهم حاجة / let's take this offline"></label>
      <label>⚠️ Contains / warnings (optional) <input name="warnings" maxlength="200" dir="auto" placeholder="passive aggression, 3 coffees, unread emails"></label>
      <div class="grid3">
        <label>Price EGP (نص size) <input name="price" type="number" min="0" step="0.01" required></label>
        <label>🌶️ Spice 1–5 <input name="spice_level" type="number" min="1" max="5" step="1" value="3"></label>
        <label>🔥 kcal of drama <input name="calories" type="number" min="0" max="999999" step="1" placeholder="0 = random"></label>
      </div>
      <fieldset>
        <legend>Badges (max 2 show on the card)</legend>
        <div id="badge-boxes" class="checks"></div>
      </fieldset>
      <div class="row-between">
        <label class="inline"><input type="checkbox" name="is_visible" checked> Visible on menu</label>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" type="button" id="dish-example">🎲 Fill funny example</button><button class="btn small" type="button" id="dish-ai" title="Uses the description box as notes about the person">✨ AI write it</button></span>
      </div>
      <p class="error" id="dish-error" role="alert"></p>
      <div class="row-between">
        <button class="btn ghost" type="button" id="dish-cancel">Cancel</button>
        <button class="btn" type="submit" id="dish-save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/__ADMIN_PATH__/admin.js" type="module"></script>
</body>
</html>
