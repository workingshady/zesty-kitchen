<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kitchen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>👨‍🍳 Kitchen Admin</h1>
    <button id="logout" class="btn ghost" hidden>Log out</button>
  </header>

  <main>
    <section id="login" class="card narrow" hidden>
      <h2>Chef only 🔒</h2>
      <form id="login-form">
        <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Log in</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="dishes">🍽️ Dishes</button>
        <button class="tab" data-tab="reviews">💬 Reviews</button>
        <button class="tab" data-tab="orders">🧾 Orders</button>
      </nav>

      <div id="tab-dishes" class="tab-panel">
        <div class="row-between">
          <h2>Dishes</h2>
          <button class="btn" id="new-dish">+ New dish</button>
        </div>
        <p class="hint">Drag rows to reorder. Changes save when you press Save.</p>
        <ul id="dish-list" class="dish-list"></ul>
      </div>

      <div id="tab-reviews" class="tab-panel" hidden>
        <h2>Reviews</h2>
        <ul id="review-list" class="simple-list"></ul>
      </div>

      <div id="tab-orders" class="tab-panel" hidden>
        <div class="row-between">
          <h2>Orders</h2>
          <button class="btn danger" id="reset-board">Reset leaderboard</button>
        </div>
        <ul id="order-list" class="simple-list"></ul>
      </div>
    </section>
  </main>

  <dialog id="dish-dialog">
    <form id="dish-form" method="dialog">
      <h2 id="dish-dialog-title">Dish</h2>
      <div class="grid2">
        <label>Arabic name <input name="name_ar" required maxlength="60" dir="rtl"></label>
        <label>English name <input name="name_en" required maxlength="60"></label>
      </div>
      <label>Description <textarea name="description" maxlength="500" rows="3" dir="auto"></textarea></label>
      <div class="grid2">
        <label>Price (EGP, the نص size) <input name="price" type="number" min="0" step="0.01" required></label>
        <label>Category <select name="category" id="category-select"></select></label>
      </div>
      <fieldset>
        <legend>Badges</legend>
        <div id="badge-boxes" class="checks"></div>
      </fieldset>
      <label class="inline"><input type="checkbox" name="is_visible" checked> Visible on menu</label>
      <label>Photo <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif"></label>
      <p class="error" id="dish-error" role="alert"></p>
      <div class="row-between">
        <button class="btn ghost" type="button" id="dish-cancel">Cancel</button>
        <button class="btn" type="submit" id="dish-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/__ADMIN_PATH__/admin.js" type="module"></script>
</body>
</html>
